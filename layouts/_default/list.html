<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ .Title }}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    h2 { border-bottom: 2px solid #eee; padding-bottom: 0.3rem; margin-top: 2rem; color: #333; }
    ul { list-style-type: none; padding: 0; }
    li { margin-bottom: 0.5rem; }
    a { color: #0066cc; text-decoration: none; font-size: 1.1rem; }
    a:hover { text-decoration: underline; }
  </style>
  <!-- Modern SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  
  <!-- Standard PNG and ICO Fallbacks -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  
  <!-- Apple Touch Icon for iOS -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  
  <!-- Web App Manifest for Android/Chrome -->
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <h1>{{ .Title }}</h1>

  <!-- Query all regular pages across the site -->
  {{ range sort (.Site.RegularPages.GroupByParam "category") "Key" "asc" }}
    <h2>{{ .Key }}</h2>
    <ul>
      <!-- Sort recipes within each category A-Z -->
      {{ range .Pages.ByTitle }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </li>
      {{ end }}
    </ul>
  {{ end }}

</body>
</html>
