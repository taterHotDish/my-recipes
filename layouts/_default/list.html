<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#1e1e24">
  <meta name="mobile-web-app-capable" content="yes">
  <title>{{ .Title }}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    h2 { border-bottom: 2px solid #eee; padding-bottom: 0.3rem; margin-top: 2rem; color: #333; }
    ul { list-style-type: none; padding: 0; }
    li { margin-bottom: 0.5rem; }
    a { color: #0066cc; text-decoration: none; font-size: 1.1rem; }
    a:hover { text-decoration: underline; }
  </style>

  <!-- Primary SVG Favicon (Firefox / Modern Browsers) -->
  <link rel="icon" type="image/svg+xml" href='{{ "favicon.svg" | relURL }}'>
  
  <!-- Standard ICO / PNG Fallbacks -->
  <link rel="icon" type="image/png" sizes="32x32" href='{{ "favicon-32x32.png" | relURL }}'>
  <link rel="icon" type="image/png" sizes="16x16" href='{{ "favicon-16x16.png" | relURL }}'>
  <link rel="shortcut icon" href='{{ "favicon.ico" | relURL }}'>
  
  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" sizes="180x180" href='{{ "apple-touch-icon.png" | relURL }}'>
  
  <!-- Web App Manifest -->
  <link rel="manifest" href='{{ "site.webmanifest" | relURL }}'>
</head>
<body>
  <h1>{{ .Title }}</h1>

  <!-- Query all regular pages across the site -->
  {{ range sort (.Site.RegularPages.GroupByParam "category") "Key" "asc" }}
    <h2>{{ .Key }}</h2>
    <ul>
      <!-- Sort recipes within each category A-Z -->
      {{ range .Pages.ByTitle }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </li>
      {{ end }}
    </ul>
  {{ end }}

</body>
</html>
