backend:
  name: github
  repo: taterHotDish/my-recipes
  branch: main
  auth_type: implicit # Bypasses Netlify OAuth and prompts for your token

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "recipes"
    label: "Recipes"
    folder: "content/recipes"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Breakfast", "Lunch", "Dinner", "Dessert", "Snacks"] }
      - { label: "Prep Time", name: "prep_time", widget: "string", required: false }
      - { label: "Cook Time", name: "cook_time", widget: "string", required: false }
      - { label: "Servings", name: "servings", widget: "number", value_type: "int", required: false }
      - { label: "Ingredients", name: "ingredients", widget: "list" }
      - { label: "Instructions / Notes", name: "body", widget: "markdown" }